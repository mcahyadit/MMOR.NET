# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash {0}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Get Commit Range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "FROM_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "TO_REF=HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "FROM_REF=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "TO_REF=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: DevShell warmup
        run: nix develop --command true
        shell: bash

      - name: Pre-Commit Checks
        run: |
          prek run --show-diff-on-failure --color=always \
            --from-ref "${{ steps.range.outputs.FROM_REF }}" \
            --to-ref "${{ steps.range.outputs.TO_REF }}"

      # - uses: https://github.com/dorny/paths-filter@v4
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            source:
              - ./analyzers/**
              - ./src/**
              - ./tests/**
            docs:
              - ./src/**
              - ./docs/**
          base: master
      - name: Run Tests
        if: steps.changes.outputs.source == 'true'
        run: dotnet run --project ./tests --configuration Release --framework net10.0

      # - name: Build Docs
      #   if: steps.changes.outputs.docs == 'true'
      #   run: nix build .#docs
