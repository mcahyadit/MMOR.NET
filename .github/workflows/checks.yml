# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash {0}
    outputs:
      source-changes: ${{ steps.changes.outputs.source || steps.changes.outputs.common }}
      docs-changes: ${{ steps.changes.outputs.docs || steps.changes.outputs.common }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Get Commit Range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "FROM_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "TO_REF=HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "FROM_REF=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "TO_REF=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: DevShell warmup
        run: nix develop --command true
        shell: bash

      - name: Pre-Commit Checks
        run: |
          prek run --show-diff-on-failure --color=always \
            --from-ref "${{ steps.range.outputs.FROM_REF }}" \
            --to-ref "${{ steps.range.outputs.TO_REF }}"

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            common:
              - ./src/**
              - ./MMOR.NET.csproj
              - ./packages.lock.json
              - ./Directory.Build.props
              - ./flake.nix
              - ./flake.lock
              - ./nix/mmor-net.nix
            source:
              - ./.github/workflows/tests.yml
              - ./nix/sourcegen.nix
              - ./analyzers/**
              - ./tests/**
            docs:
              - ./docs/**
              - ./zensical.toml
              - ./nix/docs.nix

  tests:
    uses: ./.github/workflows/tests.yml
    needs: checks
    if: ${{ needs.checks.outputs.source-changes }}
